name: MCP Apps iOS QA

on:
  workflow_dispatch:
  push:
    branches: [fix/mcp-apps-inline-height]

permissions:
  contents: read

concurrency:
  group: mcp-apps-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run build_runner build
        working-directory: packages/conduit_core
      - name: Build unsigned iOS app
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/ArmOnly.xcconfig
        run: flutter build ios --release --no-codesign
      - name: Package for SideStore signing
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr conduit-mcp-apps.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-mcp-apps-unsigned-ios
          path: build/ios/ipa/conduit-mcp-apps.ipa
          if-no-files-found: error
